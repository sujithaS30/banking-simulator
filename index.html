<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking Application</title>
    
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- SweetAlert2 CDN for Interactive Popups -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div class="container">
        <h1>Welcome to our Banking Application</h1>

        <div class="button-group">
            <button type="button" onclick="createAccount()">Create Account</button>
            <button type="button" onclick="deposit()">Deposit</button>
            <button type="button" onclick="withdraw()">Withdraw</button>
            <button type="button" onclick="transfer()">Transfer</button>
            <button type="button" onclick="viewAccount()">View Account</button>
            <button type="button" onclick="viewAllAccounts()">View All Account</button>
        </div>

        <div id="output" class="output-container">
            <p style="text-align: center; color: #777;">Select an option above to perform bank operations.</p>
        </div>
    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
